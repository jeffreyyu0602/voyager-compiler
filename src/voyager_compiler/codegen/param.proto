syntax = "proto3";

// The Magnet Alpha collateral schema.
//
// This is NOT a second compiler IR. `voyager_ir.proto` is the compiler's
// terminal representation -- loop nests, windowed references, destination
// passing -- and every target but Alpha is serialized into it.
//
// Alpha's endpoint reads something else. Its collateral converter and the
// SystemC model behind it consume a flat operation list in which each fused
// call carries its operands, its addresses in both planes, and its schedule
// factors as named keyword arguments. That is an external ABI: the field
// numbers, the message names and the file name `param_pb2` are fixed by the
// reader, not chosen here.
//
// Two consequences worth stating, because they are the reason this file is
// allowed to exist beside `voyager_ir.proto`:
//
//   1. It is *owned by the target*, not by codegen. Nothing but the
//      magnet-alpha backend writes it, and no shared pass may grow a
//      dependency on it.
//   2. It is a projection, never a source. Every value in here is already
//      decided somewhere else -- the storage plan, the schedule result, the
//      quantization contract -- and deriving one at serialization time is how
//      two components end up disagreeing about what the hardware will do.
//
// The schedule lives in the `kwargs` of an operation as `schedule_factor_*`
// entries, not in `Tiling`. `Tiling` is retained because the reader tolerates
// it and it is useful when inspecting a dump by hand, but it is not what the
// endpoint consumes: the named factors are.

package codegen;

// A placement in one storage plane.
//
// `instance` names the physical memory -- Alpha's global SRAM is split into an
// activation and a weight memory, and an address alone cannot say which one it
// is in. Two tensors in different instances legitimately share an address.
message Memory {
  optional int32 partition = 1;
  optional uint64 address = 2;
  optional string instance = 3;
}

// One tensor operand, with a placement in each plane it occupies.
//
// `memory` is the DRAM home and `scratchpad` the on-chip residency. They are
// separate fields rather than one because they are separate physical
// identities: the same logical tensor has an address in each, and neither is
// derivable from the other.
message Tensor {
  string node = 1;                 // the FX value this operand names
  repeated int32 shape = 2;
  string dtype = 3;
  optional Memory memory = 4;      // DRAM placement

  repeated int32 tiled_shape = 5;
  repeated int32 tile_strides = 6;
  optional Memory scratchpad = 7;  // on-chip placement

  optional OpOverload dequant = 8; // a dequantize folded onto the operand
  optional OpOverload reshape = 9; // a reshape folded onto the operand
  bool is_none = 10;
}

// Wrappers for the repeated arms, since `oneof` cannot hold `repeated`.
message TensorList { repeated Tensor tensors = 1; }
message IntList { repeated int64 values = 1; }
message BoolList { repeated bool values = 1; }
message ScalarList { repeated double values = 1; }

message Argument {
  oneof arg_type {
    Tensor tensor = 1;
    TensorList tensor_list = 2;
    IntList int_list = 3;
    int64 int_value = 4;
    double float_value = 5;
    bool bool_value = 6;
    string str_value = 7;
    BoolList bool_list = 8;
    ScalarList scalar_list = 9;
  }
}

// One operation call, with every operand under its canonical keyword.
message OpOverload {
  string name = 1;
  string op = 2;                    // call_function, cpu, nop, unsupported
  string target = 3;
  repeated Argument args = 4;
  map<string, Argument> kwargs = 5;
}

// A fused call, retaining the member operations it was built from.
//
// The members are kept rather than collapsed because the endpoint executes
// them as one call but the reader has to check that every one of them is
// something this machine can absorb into that call's datapath.
message OpOverloadList {
  string name = 1;
  repeated OpOverload op_list = 2;
}

message Loop {
  string node = 1;
  int32 start = 2;
  int32 end = 3;
  int32 step = 4;
  repeated Operation body = 5;
}

enum LoopIndex {
  FX = 0;
  FY = 1;
  OX = 2;
  OY = 3;
  OC = 4;
  IC = 5;
  ON = 6;
}

message LoopBound {
  LoopIndex loop = 1;
  int32 bound = 2;
}

message LevelTiling {
  repeated LoopBound loop_bounds = 1;
}

message LevelAccessCount {
  uint64 input_access_count = 1;
  uint64 output_access_count = 2;
  uint64 weight_access_count = 3;
}

message Tiling {
  string name = 1;
  repeated LevelTiling level_tilings = 2;
  repeated LevelAccessCount level_access_counts = 3;
}

message Operation {
  oneof op_type {
    OpOverload op = 1;
    OpOverloadList fused_op = 2;
    Loop loop = 3;
  }

  oneof return_type {
    Tensor output = 4;
    TensorList outputs = 5;
  }

  optional Tiling tiling = 6;
}

message Model {
  repeated Tensor inputs = 1;
  repeated Tensor parameters = 2;
  repeated Operation ops = 3;
}
