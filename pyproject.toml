[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voyager-compiler"
version = "0.2.0"
description = "A Machine Learning Compiler with native quantization support"
readme = "README.md"
authors = [
  { name = "Jeffrey Yu", email = "jeffreyy@stanford.edu" },
]
requires-python = ">=3.10"

# STABILITY FIRST: Exact versions enforced where critical.
dependencies = [
    "accelerate==1.12.0",
    "datasets==4.5.0",
    "evaluate",
    "graphviz",
    "jiwer",
    "librosa",
    "matplotlib",
    "peft==0.18.1",
    "protobuf",
    "scikit-learn",
    "scipy",
    "sentencepiece",
    "soundfile",
    "tabulate",
    "timm",
    "torch==2.12.1",
    "torchao==0.17.0",
    "torchvision==0.27.1",
    "transformers==5.13.0",
    "wandb",
    "xlsxwriter"
]

[project.optional-dependencies]
dev = ["black", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"voyager_compiler" = ["*.txt", "*.json"]
# Subpackage data (the posit lookup tables under quantization/dtypes/posit_gold).
"voyager_compiler.*" = ["*.txt", "*.json", "*.proto"]

[tool.black]
line-length = 80
target-version = ["py312"]
# Generated; regenerating would undo any formatting.  force- rather than
# extend-, so it holds when the file is named explicitly on the CLI.
force-exclude = '/src/interstellar/|(voyager_ir_pb2|aten_classifier)\.py$'

# Linting only; black owns formatting (line-length matches it so the two agree
# on what fits).
[tool.ruff]
line-length = 80
target-version = "py312"
# Honour the excludes below for explicitly-named paths too.
force-exclude = true
# Code we do not own: interstellar is an external repo, the examples' run_*.py
# are HuggingFace scripts kept close to upstream.
extend-exclude = [
    "src/interstellar",
    "examples/**/run_*.py",
    "**/voyager_ir_pb2.py",
    "**/aten_classifier.py",
]

[tool.ruff.lint]
select = ["F", "I"]

[tool.ruff.lint.per-file-ignores]
# Leave the examples' import order alone; the F rules still apply to them.
"examples/**" = ["I001"]

[tool.ruff.lint.isort]
known-first-party = ["voyager_compiler", "interstellar"]
